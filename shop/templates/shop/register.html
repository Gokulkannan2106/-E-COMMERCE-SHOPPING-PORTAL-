{% extends "shop/base.html" %}

{% block title %}Register{% endblock %}

{% block content %}
  <div class="auth-container">
      <h2>Create an Account</h2>
      <form method="post" style="display: flex; flex-direction: column; gap: 1rem;">
          {{ form.as_p }}
          {% csrf_token %}
          <input type="submit" value="Sign Up" class="button">
      </form>
      <p style="margin-top: 1.5rem; text-align: center; color: var(--text-muted);">Already have an account? <a href="{% url 'shop:login' %}" style="color: var(--primary-color); font-weight: 600;">Login</a></p>
  </div>
{% endblock %}
