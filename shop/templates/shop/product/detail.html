{% extends "shop/base.html" %}

{% block title %}{{ product.name }}{% endblock %}

{% block content %}
  <div class="product-detail">
    <img src="{{ product.get_image_url }}" alt="{{ product.name }}" style="max-width: 400px; height: 400px; object-fit: contain; border-radius: 8px;">
    <div class="product-detail-info">

        <h2>{{ product.name }}</h2>
        <p>Category: <a href="{% url 'shop:product_list_by_category' product.category.slug %}">{{ product.category.name }}</a></p>
        <p class="price">${{ product.price }}</p>
        <div style="margin-bottom: 2rem; color: #666;">
            {{ product.description|linebreaks }}
        </div>
        
        <form action="{% url 'cart:cart_add' product.id %}" method="post" style="display: flex; gap: 1rem; align-items: center;">
          {{ cart_product_form }}
          {% csrf_token %}
          <input type="submit" value="Add to cart">
        </form>
    </div>
  </div>
{% endblock %}
